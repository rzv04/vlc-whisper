name: PR 59 formatter

on:
  push:
    branches:
      - fix/p3-p4-ledger-issues

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p3-p4-ledger-issues
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Emit formatted worker blob
        run: |
          clang-format -i worker/src/vw_worker.c
          printf 'FORMATTED_WORKER_BASE64='
          base64 -w0 worker/src/vw_worker.c
          printf '\n'
