name: PR 60 formatter output

on:
  push:
    branches:
      - feat/translation-failure-blame-logging

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/translation-failure-blame-logging
          fetch-depth: 0
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Format and stage output branch
        run: |
          clang-format -i plugin/src/vw_worker_client.c worker/include/vw_worker_translation_diag_override.h tests/unit/test_translate_async.c
          rm -f .github/workflows/format-pr60-output.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/src/vw_worker_client.c worker/include/vw_worker_translation_diag_override.h tests/unit/test_translate_async.c .github/workflows/format-pr60-output.yml
          git commit -m "style: apply clang format"
          git push origin HEAD:refs/heads/automation/pr60-format-output --force
