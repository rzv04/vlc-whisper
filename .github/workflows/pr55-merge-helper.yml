name: PR55 Merge Helper

on:
  push:
    branches:
      - tmp/pr55-main-merge-helper

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main and resolve known PR 55 conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$merge_rc" -ne 0 ]; then
            expected=$'lua/extensions/vlc_whisper_settings.lua\nprotocol/include/vw_protocol_types.h\nworker/src/vw_worker.c'
            test "$conflicts" = "$expected"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              git checkout --conflict=merge -- "$file"
            done <<< "$conflicts"
            python3 .github/pr55_merge_resolve.py
            git add -- $conflicts
          fi
          git diff --check --cached
          rm -f .github/workflows/pr55-merge-helper.yml .github/pr55_merge_resolve.py
          git add -A
          git commit -m "chore: prepare resolved PR 55 merge tree"
          git push origin HEAD:refs/heads/tmp/pr55-main-merge-resolved-v2
