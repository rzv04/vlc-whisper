name: PR55 Merge Helper

on:
  push:
    branches:
      - tmp/pr55-main-merge-helper

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and publish temporary result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          echo "PR55_MERGE_CONFLICTS_BEGIN"
          printf '%s\n' "$conflicts"
          echo "PR55_MERGE_CONFLICTS_END"
          if [ "$merge_rc" -ne 0 ]; then
            test -n "$conflicts"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              git checkout --ours -- "$file"
              git add -- "$file"
            done <<< "$conflicts"
          fi
          rm -f .github/workflows/pr55-merge-helper.yml
          git add -A
          git commit -m "chore: prepare PR 55 merge result"
          git push --force origin HEAD:refs/heads/tmp/pr55-main-merge-result
